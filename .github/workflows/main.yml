
name: Build IFAL57_WRT STB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          mkdir -p android-source
          unzip -q IFAL57_WRT_STB_source.zip -d android-source
          find android-source -maxdepth 5 -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project and build APK
        run: |
          ROOT_DIR=$(find android-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT_DIR" ]; then
            echo "Gradle project tidak ditemukan!"
            find android-source -maxdepth 5 -type f
            exit 1
          fi

          echo "Gradle project: $ROOT_DIR"
          cd "$ROOT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IFAL57_WRT_STB
          path: android-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
