
name: Build IFAL57_WRT STB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          mkdir -p android-source
          unzip -q IFAL57_WRT_STB_source.zip -d android-source
          ls -la android-source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
  run: |
    ROOT_DIR=$(find android-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | sed 's|/[^/]*$||')

    if [ -z "$ROOT_DIR" ]; then
      echo "Gradle project tidak ditemukan!"
      find android-source -maxdepth 4 -type f
      exit 1
    fi

    cd "$ROOT_DIR"
    gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IFAL57_WRT_STB
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
