
name: Build IFAL57_WRT STB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q IFAL57_WRT_STB_source.zip -d .
          ls -la IFAL57_WRT_STB_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: IFAL57_WRT_STB_source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IFAL57_WRT_STB
          path: IFAL57_WRT_STB_source/app/build/outputs/apk/debug/app-debug.apk
